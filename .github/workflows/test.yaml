name: Provider Learning CICD

on:
  push:
  branches: [develop]
  workflow_dispatch:
  permissions:
  contents: read

  concurrency:
   group: ci-${{ github.ref }}
  cancel-in-progress: true
  
  jobs:
  checks:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: subosito/flutter-action@v2
    with:
          channel: stable
          cache: true 

  - run: flutter pub get
  - run: flutter analyze
  - run: flutter test --coverage
deploy-web:
needs: checks
runs-on: ubuntu-latest
permissions:
      contents: read
      pages: write
      id-token: write
environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
      with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4